# =============================================================================
# telegraf.conf — mbuntu (192.168.1.5)
# Migrated from Mac Pro 2026-02-21
# Changes: removed macOS LaunchAgent file inputs (disk_metrics, net_metrics, etc.)
#          Linux has real /proc so disk/net/system collectors work natively.
#          SMART, SMB, security, plex scripts copied to /scripts/
#          Orbi metrics unchanged (reaches router at 192.168.1.1)
# =============================================================================

[global_tags]
  location = "capes-ventura"
  environment = "homelab"

[agent]
  interval = "30s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "5s"
  flush_interval = "30s"
  flush_jitter = "5s"
  precision = ""
  hostname = "mbuntu"
  omit_hostname = false

# Output: Prometheus scrape endpoint
[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
  expiration_interval = "6m"

# Native Linux host metrics (work properly on bare metal Linux)
[[inputs.cpu]]
  percpu = true
  totalcpu = true
  collect_cpu_time = false
  report_active = false

[[inputs.mem]]

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]

[[inputs.diskio]]

[[inputs.net]]
  interfaces = ["enp6s0", "enp7s0"]

[[inputs.system]]

[[inputs.processes]]

# ZFS pool metrics (native on mbuntu)
[[inputs.zfs]]
  poolMetrics = true

# Plex active streams (reaches Plex on Mac Pro via LAN)
[[inputs.exec]]
  commands = ["/scripts/plex_metrics.sh"]
  timeout = "10s"
  interval = "30s"
  data_format = "prometheus"
  environment = ["PLEX_TOKEN=XDMas6E2Nq7-MCGkeeDE"]

# Orbi router metrics via SOAP API
[[inputs.exec]]
  commands = ["/scripts/orbi_metrics.sh"]
  timeout = "25s"
  interval = "30s"
  data_format = "prometheus"
  environment = ["ROUTER_PASS=Psw500rr!!"]

# SMART drive health — written by capes-smart-metrics.timer on host every 5m.
# smartctl requires host root + glibc; cannot run inside telegraf container.
[[inputs.file]]
  files = ["/run/telegraf-smart/smart.prom"]
  data_format = "prometheus"

# Security events
[[inputs.exec]]
  commands = ["/scripts/security_metrics.sh"]
  timeout = "20s"
  interval = "60s"
  data_format = "prometheus"

# NAS health: ZFS pool capacity, health, vdev errors, memory, root disk.
# Written by capes-nas-metrics.timer on the host every 5 minutes.
# glibc mismatch prevents running zpool inside this container (host=Ubuntu24/GLIBC2.38).
[[inputs.file]]
  files = ["/run/telegraf-nas/nas.prom"]
  data_format = "prometheus"
