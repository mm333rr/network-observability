# =============================================================================
# alerts.yml — Prometheus alerting rules for Capes Homelab
# Host: Mac Pro 192.168.1.30 | NAS: mbuntu 192.168.1.35
# All alerts:
#   - use threshold expressions (not increase()) so they resolve cleanly
#   - have repeat_interval set in alertmanager.yml (not here)
#   - have both warning and critical tiers where appropriate
# =============================================================================

groups:

  # ===========================================================================
  # Node Exporter — Mac Pro system health (via node-exporter)
  # ===========================================================================
  - name: host_alerts
    rules:
      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space on {{ $labels.host }}"
          description: "Boot volume has less than 15% free. Current: {{ $value | printf \"%.1f\" }}% free."

      - alert: DataVolumeCritical
        expr: (node_filesystem_avail_bytes{mountpoint=~"/Volumes/.*"} / node_filesystem_size_bytes{mountpoint=~"/Volumes/.*"}) * 100 < 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Data volume nearly full: {{ $labels.mountpoint }}"
          description: "Volume {{ $labels.mountpoint }} has less than 10% free."

      # Raised from 90% to 95%, extended from 10m to 20m.
      # Mac Pro regularly hits 90%+ during Plex transcoding, ClaudeSort, DupeScan, etc.
      - alert: MacProCriticalLoad
        # Raised for: 5m → 15m and threshold 40 → 48 (3x 16 cores).
        # load>40 fired repeatedly overnight during heavy but normal workloads
        # (Plex batch optimizer, ClaudeSort, etc.). 48 = 3x cores sustained for
        # 15min is a genuine jam/freeze, not just a heavy job. If it's truly
        # frozen you won't be fixing it in under 15 minutes anyway.
        expr: node_load1{host="macpro"} > 48
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "CRITICAL: Mac Pro load {{ $value | printf \"%.1f\" }} (>48 = 3x 16 cores)"
          description: "Mac Pro load above 48 for 15+ minutes. System likely frozen or severely jammed. Check Activity Monitor immediately."

      # MacProSwapSurging REMOVED: fired for brief 5-min windows during normal
      # heavy workloads (ClaudeSort, DupeScan). Not actionable — swap bursts
      # during batch jobs are expected on macOS. MacProMemoryPressureCritical
      # (compressor >4GB for 5m) is the correct freeze-precursor signal.

      # NEW: macOS memory compressor — macOS-specific freeze precursor.
      # node_memory_compressed_bytes already scraped. >2 GB = RAM exhausted.
      # >4 GB = thrashing/freeze likely.
      - alert: MacProMemoryPressureCritical
        expr: node_memory_compressed_bytes{host="macpro"} / 1073741824 > 4
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "CRITICAL: Mac Pro memory compressor {{ $value | printf \"%.1f\" }} GB — possible freeze"
          description: "macOS memory compressor above 4 GB. System likely thrashing or frozen. Immediate intervention needed."

      # Mac Pro sustained high CPU — secondary processes (ffmpeg) crowding out Plex/WindowServer
      # node_cpu_usage is 0-100% of total (all 16 cores). >90% for 5m = system saturated.
      - alert: MacProHighCPUSustained
        expr: 100 - (avg by(host)(rate(node_cpu_seconds_total{mode="idle",host="macpro"}[5m])) * 100) > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "WARNING: Mac Pro CPU {{ $value | humanize }}% for 5+ min"
          description: "Mac Pro CPU above 90% sustained. Likely batch encode (ffmpeg) crowding Plex/WindowServer. plex-guardian should be throttling — check ~/Library/Logs/plex-guardian.log."

      # Mac Pro CPU saturation at critical level — WindowServer watchdog panic risk
      # >95% for 3m is the pre-panic danger zone identified from Apr 1 2026 incident
      - alert: MacProCPUPanicRisk
        expr: 100 - (avg by(host)(rate(node_cpu_seconds_total{mode="idle",host="macpro"}[2m])) * 100) > 95
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "CRITICAL: Mac Pro CPU {{ $value | humanize }}% — WindowServer panic risk"
          description: "Mac Pro CPU above 95% for 3+ minutes. WindowServer watchdog kernel panic risk. plex-guardian should have intervened. Verify guardian is running and check ffmpeg nice levels immediately."

      - alert: VolumeAlmostFull
        expr: disk_usage_percent > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Volume {{ $labels.mount }} is {{ $value | printf \"%.0f\" }}% full"
          description: "Mac Pro volume {{ $labels.mount }} has exceeded 90% capacity."

      - alert: VolumeCriticallyFull
        expr: disk_usage_percent > 95
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "CRITICAL: Volume {{ $labels.mount }} is {{ $value | printf \"%.0f\" }}% full"
          description: "Mac Pro volume {{ $labels.mount }} is nearly out of space."

      - alert: SMARTFailure
        expr: smart_health == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "SMART failure on disk {{ $labels.disk }}"
          description: "Drive {{ $labels.disk }} is reporting SMART health failure."

      - alert: DriveTemperatureHigh
        expr: smart_temperature_celsius{host!="mbuntu"} > 65
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High drive temp on {{ $labels.disk }}: {{ $value | printf \"%.0f\" }}°C"
          description: "Drive {{ $labels.disk }} temperature exceeds 65°C for 10+ minutes."

      - alert: DriveTemperatureCritical
        expr: smart_temperature_celsius{host!="mbuntu"} > 70
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "CRITICAL drive temp on {{ $labels.disk }}: {{ $value | printf \"%.0f\" }}°C"
          description: "Drive {{ $labels.disk }} temperature exceeds 70°C — at or above Apple SSD SM0256F max spec."

  # ===========================================================================
  # Mac Pro security (via Telegraf exec scripts)
  # Uses rate() over a window so the alert resolves when failures stop.
  # ===========================================================================
  - name: macpro_security_alerts
    rules:
      # rate() * 300 = events per 5-minute window; resolves when rate drops to 0
      - alert: SSHLoginFailures
        expr: rate(security_ssh_logins_failed[5m]) * 300 > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "SSH brute-force on MacPro"
          description: "More than 5 SSH login failures in a 5-minute window (current rate: {{ $value | printf \"%.0f\" }}/5m)."

      - alert: PlexDown
        expr: plex_up == 0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Plex Media Server is unreachable"
          description: "Plex on Mac Pro hasn't responded for 3+ minutes."

  # ===========================================================================
  # Infrastructure — scrape target up/down, network errors
  # ===========================================================================
  - name: infrastructure_alerts
    rules:
      - alert: InstanceDown
        # 10m window: filters launchd/docker restarts that recover within a minute or two.
        # plex-health-monitor was crashing on Plex float speed values and restarting
        # every ~60s → critical+resolved email pairs all night. Root cause fixed in
        # plex_health_monitor.py (int(float()) cast + per-item try/except). Keeping
        # 10m here as belt-and-suspenders against any future flapping process.
        expr: up == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Instance {{ $labels.instance }} is DOWN"
          description: "{{ $labels.job }} target {{ $labels.instance }} has been unreachable for 10+ minutes. Action required."

      - alert: NetworkErrors
        expr: rate(node_network_transmit_errs_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Network errors on {{ $labels.instance }} / {{ $labels.device }}"
          description: "TX errors at {{ $value | printf \"%.1f\" }}/sec."

  # ===========================================================================
  # Orbi router / mesh
  # ===========================================================================
  - name: orbi_alerts
    rules:
      # OrbiHighCPU removed: RBR750 SOAP GetSystemInfo always reports
      # NewCPUUtilization=100 regardless of actual load (firmware bug V7.2.8.2_5.1.18).
      # Router health is monitored via ping RTT and internet latency instead.

      # Sustained high router latency = overloaded or failing router
      - alert: OrbiHighLatency
        expr: orbi_ping_rtt_ms{target="router"} > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High latency to Orbi router: {{ $value | printf \"%.1f\" }}ms"
          description: "Ping RTT to 192.168.1.1 above 50ms for 5+ minutes. Router may be overloaded."

      - alert: OrbiHighMemory
        expr: orbi_memory_utilization_pct > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Orbi router memory at {{ $value | printf \"%.0f\" }}%"
          description: "Orbi RBR750 memory above 85% for 10+ minutes."

      # Satellite up/down: derived from active client count (no pingable IP available).
      # NOTE: RBR750 firmware V7.2.x+ returns 401 on GetAttachDevice2 SOAP calls
      # (confirmed 2026-02-22) — orbi_satellite_up is permanently 0 and cannot be
      # trusted as a satellite health signal. Alert suppressed until SOAP auth is
      # restored or an alternative detection method is implemented.
      # TODO: re-enable when SOAP auth issue is resolved or satellite ping is available.
      # - alert: OrbiSatelliteDown
      #   expr: orbi_satellite_up == 0
      #   for: 5m

      - alert: OrbiWANDown
        # NOTE: WANIPConnection:1 SOAP service returns 401 on RBR750 firmware V7.2.x+
        # (confirmed 2026-02-22). orbi_wan_up is permanently 0 and cannot be trusted.
        # Replaced with ping-based internet check: if Cloudflare 1.1.1.1 AND Google 8.8.8.8
        # are both unreachable (RTT = -1), internet is actually down.
        # Both must fail to avoid false positives from transient single-target drops.
        expr: orbi_ping_rtt_ms{target="cloudflare"} == -1 and orbi_ping_rtt_ms{target="google"} == -1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Internet connection is DOWN (both Cloudflare and Google unreachable)"
          description: "Ping to both 1.1.1.1 and 8.8.8.8 has been -1 (failed) for 2+ minutes. Internet is likely down."

      - alert: OrbiRouterDown
        expr: orbi_up == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Orbi router is unreachable"
          description: "Cannot reach Orbi RBR750 at 192.168.1.1 for 3+ minutes."

      # Internet latency alert (separate from router latency)
      - alert: InternetHighLatency
        expr: orbi_ping_rtt_ms{target="cloudflare"} > 200
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High internet latency: {{ $value | printf \"%.0f\" }}ms to Cloudflare"
          description: "Ping to 1.1.1.1 above 200ms for 5+ minutes. Possible ISP issue or WAN congestion."

  # ===========================================================================
  # NFS mount health (detected via Telegraf disk_metrics)
  # absent() alone never resolves; use unless/or pattern instead.
  # ===========================================================================
  - name: nfs_alerts
    rules:
      # Fires when the metric has existed before but disappears; resolves when it returns.
      # The OR vector(0) == 1 arm is always false, keeping absent() resolvable:
      #   - firing  = absent() returns 1, vector arm never fires
      #   - resolved = metric returns, absent() returns no series → rule evaluates false
      - alert: NFSMountMissing
        expr: |
          absent(node_filesystem_avail_bytes{host="mbuntu",mountpoint="/tank/tv"})
          or absent(node_filesystem_avail_bytes{host="mbuntu",mountpoint="/tank/movies"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "ZFS tank mount missing on mbuntu"
          description: "ZFS dataset /tank/tv or /tank/movies is gone. NFS exports may be down."

      - alert: NFSVolumeAlmostFull
        expr: (1 - node_filesystem_avail_bytes{host="mbuntu",fstype="zfs",mountpoint=~"/tank/.+"} / node_filesystem_size_bytes{host="mbuntu",fstype="zfs",mountpoint=~"/tank/.+"}) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "NFS volume {{ $labels.mount }} is {{ $value | printf \"%.0f\" }}% full"
          description: "NAS volume {{ $labels.mount }} has exceeded 85% capacity."

      - alert: NFSVolumeCriticallyFull
        expr: (1 - node_filesystem_avail_bytes{host="mbuntu",fstype="zfs",mountpoint=~"/tank/.+"} / node_filesystem_size_bytes{host="mbuntu",fstype="zfs",mountpoint=~"/tank/.+"}) * 100 > 95
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "CRITICAL: NFS volume {{ $labels.mount }} is {{ $value | printf \"%.0f\" }}% full"
          description: "NAS volume {{ $labels.mount }} is nearly out of space."

  # ===========================================================================
  # Docker container health (via cAdvisor)
  # ===========================================================================
  - name: docker_alerts
    rules:
      - alert: ContainerHighDiskUsage
        expr: (container_fs_usage_bytes{name!=""} / container_fs_limit_bytes{name!=""}) * 100 > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} filesystem at {{ $value | printf \"%.0f\" }}%"
          description: "Docker container {{ $labels.name }} overlay filesystem usage is high."

      # rate() over 15m window → resolves as soon as restarts stop
      - alert: ContainerRestartLoop
        expr: rate(container_restart_count{name!=""}[15m]) * 900 > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} restarting repeatedly"
          description: "Container {{ $labels.name }} has restarted >3 times in 15 minutes."

      # 8 containers expected (alertmanager, cadvisor, grafana, loki,
      #   node-exporter, prometheus, promtail, telegraf)
      - alert: DockerContainerCountLow
        expr: count(container_memory_usage_bytes{id=~"/docker/[0-9a-f]+"}) < 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Docker container count dropped to {{ $value | printf \"%.0f\" }}"
          description: "Expected 8 observability containers. Check docker ps on Mac Pro."

  # ===========================================================================
  # Ubuntu NAS — ZFS pool, disk SMART, and system health
  # All via SSH → Telegraf inputs.file (nas_metrics.prom, 5m cadence)
  # ===========================================================================
  - name: nas_alerts
    rules:
      # NAS SSH connectivity
      - alert: NASUnreachable
        expr: nas_up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Ubuntu NAS (mbuntu) is unreachable"
          description: "SSH to mbuntu at 192.168.1.35 has failed for 5+ minutes. NFS, ZFS, and SMART data unavailable."

      # ZFS pool health (0 = DEGRADED/FAULTED, 1 = ONLINE)
      - alert: ZFSPoolDegraded
        expr: nas_zpool_health == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "ZFS pool {{ $labels.pool }} is DEGRADED or FAULTED"
          description: "ZFS pool {{ $labels.pool }} on mbuntu is not ONLINE. Run 'zpool status {{ $labels.pool }}' immediately."

      # Per-vdev checksum errors — sdd currently shows 1 error
      - alert: ZFSChecksumErrors
        expr: nas_zpool_cksum_errors > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "ZFS checksum errors on {{ $labels.pool }}/{{ $labels.vdev }}"
          description: "{{ $value | printf \"%.0f\" }} checksum error(s) on vdev {{ $labels.vdev }} in pool {{ $labels.pool }}. May indicate disk {{ $labels.vdev }} is failing. Run 'zpool scrub'."

      - alert: ZFSReadWriteErrors
        expr: nas_zpool_read_errors > 0 or nas_zpool_write_errors > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "ZFS read/write errors on {{ $labels.pool }}/{{ $labels.vdev }}"
          description: "Read or write errors detected on vdev {{ $labels.vdev }} in pool {{ $labels.pool }}. Disk failure likely."

      # ZFS pool capacity
      - alert: ZFSPoolAlmostFull
        expr: nas_zpool_capacity_pct > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "ZFS pool {{ $labels.pool }} is {{ $value | printf \"%.0f\" }}% full"
          description: "ZFS pools degrade above 80% — fragmentation increases. Free space on pool {{ $labels.pool }}."

      - alert: ZFSPoolCriticallyFull
        expr: nas_zpool_capacity_pct > 90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "CRITICAL: ZFS pool {{ $labels.pool }} at {{ $value | printf \"%.0f\" }}%"
          description: "ZFS pool {{ $labels.pool }} is critically full. Performance severely degraded above 90%."

      # NAS SMART health (1=pass, 0=fail, -1=unknown)
      - alert: NASSMARTFailure
        expr: smart_health == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "SMART failure on NAS disk {{ $labels.disk }}"
          description: "Drive {{ $labels.disk }} on mbuntu is reporting SMART health failure. Replace immediately."

      # NAS disk temperatures — HDDs run hotter than SSDs; warn >55°C, critical >60°C
      - alert: NASDriveTemperatureHigh
        expr: smart_temperature_celsius{host="mbuntu"} > 55
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "NAS drive {{ $labels.disk }} temperature {{ $value | printf \"%.0f\" }}°C"
          description: "NAS HDD {{ $labels.disk }} above 55°C for 15+ minutes. Check case airflow on mbuntu."

      - alert: NASDriveTemperatureCritical
        expr: smart_temperature_celsius{host="mbuntu"} > 60
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "CRITICAL: NAS drive {{ $labels.disk }} at {{ $value | printf \"%.0f\" }}°C"
          description: "NAS HDD {{ $labels.disk }} above 60°C — exceeds safe HDD operating range. Risk of data loss."

      # NAS system resources
      - alert: NASHighMemory
        expr: mem_used_percent{host="mbuntu"} > 90  # fixed 2026-04-12: was nas_memory_usage_pct (never populated)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "NAS memory usage at {{ $value | printf \"%.0f\" }}%"
          description: "mbuntu memory above 90% for 10+ minutes. ZFS ARC may be over-provisioned."

      - alert: NASRootDiskFull
        expr: disk_used_percent{host="mbuntu",device="nvme0n1p2"} > 80  # fixed 2026-04-12: was nas_disk_root_usage_pct (never populated)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "NAS root filesystem at {{ $value | printf \"%.0f\" }}%"
          description: "mbuntu / (boot disk) is {{ $value | printf \"%.0f\" }}% full. Clean old kernels/logs."

      - alert: CriticalContainerDown
        # UPDATED 2026-02-22: cAdvisor v0.49.1 required for cgroupv2 per-container metrics.
        # Previously used absent(container_last_seen{name!=""}) but cAdvisor on cgroupv2
        # only emits root cgroup until v0.49+. Now alerts when cAdvisor scrape target down.
        # Per-container alerts (ContainerHighDiskUsage, ContainerRestartLoop) will work
        # correctly once cAdvisor v0.49.1 is running and cgroupv2 per-container metrics flow.
        expr: |
          up{job="cadvisor"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "cAdvisor is DOWN -- no Docker container metrics"
          description: "cAdvisor scrape target is unreachable for 5+ minutes. Docker container monitoring is offline."

  # ===========================================================================
  # AdGuard Home DNS health and stats (via adguard-exporter on port 9618)
  # ===========================================================================
  - name: adguard_dns
    rules:
      - alert: AdGuardDown
        expr: up{job="adguard-exporter"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "AdGuard Home exporter is DOWN"
          description: "adguard-exporter cannot reach AdGuard Home. DNS filtering may be offline."

      - alert: AdGuardProtectionDisabled
        expr: adguard_protection_enabled == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "AdGuard protection is DISABLED"
          description: "AdGuard Home DNS filtering has been turned off. All ads/trackers are unblocked."

      - alert: AdGuardNotRunning
        expr: adguard_running == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "AdGuard Home is NOT running"
          description: "AdGuard Home process has stopped. DNS resolution for the network may be degraded."

      - alert: DNSQueryRateDrop
        expr: rate(adguard_dns_queries_total[5m]) * 60 < 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "DNS query rate near zero (less than 1/min for 5m)"
          description: "AdGuard is receiving almost no DNS queries. Devices may have lost connectivity to 192.168.1.2."

      - alert: DNSBlockRateSurge
        expr: >
          (rate(adguard_blocked_filtering_total[10m]) / rate(adguard_dns_queries_total[10m])) * 100 > 60
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "DNS block rate above 60% -- possible over-blocking"
          description: "More than 60% of DNS queries are being blocked. A new filter list may be breaking services. Check AdGuard logs."

      - alert: DNSHighLatency
        expr: adguard_avg_processing_time_seconds > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "DNS avg processing time above 100ms"
          description: "AdGuard Home average DNS resolution time above 100ms for 5+ minutes. Upstream DNS may be slow."

      - alert: DNSCriticalLatency
        expr: adguard_avg_processing_time_seconds > 0.5
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "CRITICAL DNS latency above 500ms average"
          description: "AdGuard DNS resolution averaging above 500ms. Network or upstream DNS severely degraded."

  # ── Reboot / Shutdown Detection ─────────────────────────────────────────────
  - name: reboot_detection
    rules:

      # Fires when node_boot_time_seconds changes — i.e. a machine rebooted.
      # changes() over 10m: if boot time increases, a reboot occurred.
      # Creates a visible firing event on Grafana dashboards for every reboot.
      - alert: NodeRebooted
        expr: changes(node_boot_time_seconds[10m]) > 0
        for: 0m
        labels:
          severity: info
          service: system
        annotations:
          summary: "{{ $labels.instance }} rebooted"
          description: >
            Node {{ $labels.instance }} has rebooted. Boot time changed within
            the last 10 minutes. Check reboot-notify email for pre/post metrics.

      # Catches nodes that came back online recently (reboot or cold start).
      - alert: NodeRecentBoot
        expr: (time() - node_boot_time_seconds) < 600
        for: 0m
        labels:
          severity: info
          service: system
        annotations:
          summary: "{{ $labels.instance }} came back online (up < 10m)"
          description: >
            Node {{ $labels.instance }} has been up less than 10 minutes.
            Verify all services resumed normally after reboot.
