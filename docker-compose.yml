networks:
  observability:
    name: observability
    driver: bridge
    ipam:
      config:
      - subnet: 172.20.0.0/24
volumes:
  prometheus_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/docker/observability/data/prometheus
  grafana_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/docker/observability/data/grafana
  loki_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/docker/observability/data/loki
  alertmanager_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/docker/observability/data/alertmanager
services:
  grafana:
    image: grafana/grafana:10.3.3
    container_name: grafana
    restart: unless-stopped
    networks:
    - observability
    ports:
    - 192.168.1.5:3001:3000
    volumes:
    - grafana_data:/var/lib/grafana
    - /srv/docker/observability/grafana/provisioning:/etc/grafana/provisioning
    - /srv/docker/observability/grafana/dashboards:/var/lib/grafana/dashboards
    environment:
    - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:-admin}
    - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASS:-changeme_on_first_login}
    - GF_USERS_ALLOW_SIGN_UP=false
    - GF_SERVER_ROOT_URL=http://grafana.capes.local:3001
    - GF_SERVER_DOMAIN=192.168.1.5
    - GF_ANALYTICS_REPORTING_ENABLED=false
    - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/home.json
    depends_on:
    - prometheus
    - loki
    labels:
    - stack=observability
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: prometheus
    restart: unless-stopped
    networks:
    - observability
    ports:
    - 192.168.1.5:9090:9090
    volumes:
    - prometheus_data:/prometheus
    - /srv/docker/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - /srv/docker/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --storage.tsdb.retention.time=90d
    - --web.console.libraries=/etc/prometheus/console_libraries
    - --web.console.templates=/etc/prometheus/consoles
    - --web.enable-lifecycle
    - --web.enable-admin-api
    labels:
    - stack=observability
  loki:
    image: grafana/loki:2.9.4
    container_name: loki
    restart: unless-stopped
    networks:
    - observability
    ports:
    - 192.168.1.5:3100:3100
    volumes:
    - loki_data:/loki
    - /srv/docker/observability/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    labels:
    - stack=observability
  promtail:
    image: grafana/promtail:3.0.0
    container_name: promtail
    restart: unless-stopped
    networks:
    - observability
    ports:
    - 192.168.1.5:1514:1514/udp
    - 192.168.1.5:9080:9080
    volumes:
    - /var/log:/var/log:ro
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - /srv/docker/observability/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    labels:
    - stack=observability
  telegraf:
    build:
      context: ./telegraf
      dockerfile: Dockerfile
    container_name: telegraf
    restart: unless-stopped
    networks:
    - observability
    ports:
    - 192.168.1.5:9273:9273
    privileged: true
    volumes:
    - /srv/docker/observability/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    - /srv/docker/observability/telegraf/scripts:/scripts:ro
    - /dev:/dev:ro
    # NAS metrics textfile — written by capes-nas-metrics.timer on host every 5m.
    # ZFS tools cannot run inside the container (glibc version mismatch with host Ubuntu 24).
    # Textfile collector pattern: host writes nas.prom, telegraf reads it via inputs.file.
    - /run/telegraf-nas:/run/telegraf-nas:ro
    # SMART metrics textfile — written by capes-smart-metrics.timer on host every 5m.
    # smartctl requires host root + glibc; same glibc mismatch as zpool.
    - /run/telegraf-smart:/run/telegraf-smart:ro
    extra_hosts:
    - host.docker.internal:host-gateway
    environment:
    - PLEX_TOKEN=${PLEX_TOKEN}
    - ROUTER_PASS=${ROUTER_PASS}
    labels:
    - stack=observability
  cadvisor:
    # v0.47.2: last version whose go-dockerclient works with Docker API <=1.44.
    # v0.49.x hardcodes client API 1.41 and Docker 29 rejects it (needs >=1.44).
    # cgroupv2 + systemd driver fix: mount /sys/fs/cgroup rw, add --raw_cgroup_prefix_whitelist
    # Updated 2026-02-22
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: cadvisor
    restart: unless-stopped
    networks:
    - observability
    ports:
    - 192.168.1.5:8080:8080
    volumes:
    - /:/rootfs:ro
    - /var/run:/var/run:ro
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - /sys:/sys:ro
    - /sys/fs/cgroup:/sys/fs/cgroup:rw
    - /var/lib/docker:/var/lib/docker:ro
    - /dev/disk:/dev/disk:ro
    privileged: true
    devices:
    - /dev/kmsg
    command:
    - --docker_only=true
    - --store_container_labels=true
    - --housekeeping_interval=30s
    - --max_housekeeping_interval=35s
    - --raw_cgroup_prefix_whitelist=/system.slice/docker
    labels:
    - stack=observability
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    restart: unless-stopped
    networks:
    - observability
    ports:
    - 192.168.1.5:9093:9093
    volumes:
    - alertmanager_data:/alertmanager
    - /srv/docker/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    - /srv/docker/observability/alertmanager/entrypoint.sh:/entrypoint.sh:ro
    env_file:
    - /srv/docker/secrets/smtp.env
    environment:
    - ALERT_TO=matt@am180.us
    entrypoint:
    - /bin/sh
    - /entrypoint.sh
    labels:
    - stack=observability

  adguard-exporter:
    image: ghcr.io/henrywhitaker3/adguard-exporter:latest
    container_name: adguard-exporter
    restart: unless-stopped
    networks:
    - observability
    ports:
    - 192.168.1.5:9618:9618
    environment:
    - ADGUARD_SERVERS=http://192.168.1.2:3000
    - ADGUARD_USERNAMES=admin
    - ADGUARD_PASSWORDS=${ADGUARD_PASS}
    - INTERVAL=15s
    labels:
    - stack=observability
