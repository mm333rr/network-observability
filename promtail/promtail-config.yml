# =============================================================================
# promtail-config.yml — mbuntu (192.168.1.5)
# Migrated from Mac Pro 2026-02-21
# Changes: removed macOS/Plex log paths, updated host label to mbuntu,
#          docker socket path unchanged (same on Linux)
# =============================================================================

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  # ---------------------------------------------------------------------------
  # Ubuntu system logs
  # ---------------------------------------------------------------------------
  - job_name: ubuntu-system
    static_configs:
      - targets:
          - localhost
        labels:
          job: ubuntu-system
          host: mbuntu
          __path__: /var/log/**/*.log

  # ---------------------------------------------------------------------------
  # Docker container logs via Docker service discovery
  # ---------------------------------------------------------------------------
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      - target_label: 'job'
        replacement: 'docker'
      - target_label: 'host'
        replacement: 'mbuntu'

  # ---------------------------------------------------------------------------
  # Syslog receiver — network devices (router, switches)
  # Point Orbi syslog to 192.168.1.5:1514/udp
  # ---------------------------------------------------------------------------
  - job_name: syslog-network
    syslog:
      listen_address: 0.0.0.0:1514
      listen_protocol: udp
      idle_timeout: 60s
      label_structured_data: true
      labels:
        job: syslog-network
    relabel_configs:
      - source_labels: ['__syslog_message_hostname']
        target_label: 'host'
      - source_labels: ['__syslog_message_app_name']
        target_label: 'app'
      - source_labels: ['__syslog_message_severity']
        target_label: 'severity'
      - source_labels: ['__syslog_message_facility']
        target_label: 'facility'
